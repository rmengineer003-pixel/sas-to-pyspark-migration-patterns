[project]
name = "sas2spark"
version = "0.1.0"
description = "SAS DATA step and PROC patterns migrated to PySpark, with parity tests and a reconciliation helper"
requires-python = ">=3.10"
dependencies = ["pyspark>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
